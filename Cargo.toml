[package]
name = "coyote-apple"
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
description = "coyote, internal profile — org-grade provenance, packaging, introspection, and benchmarking on the same source-to-silicon pipeline"

[[bin]]
name = "coyote-apple"
path = "src/main.rs"

[dependencies]
coyote = { path = "../coyote", package = "coyote-lang" }
mil_infer = { git = "https://github.com/savageAZfck/mil_spec" }
metal = "0.33.0"
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2.7.1"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
tokenizers = "0.22"
ureq = "3.4"
