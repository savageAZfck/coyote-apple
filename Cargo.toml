[package]
name = "coyote-apple"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "coyote, internal profile — org-grade provenance, packaging, introspection, and benchmarking on the same source-to-silicon pipeline"

[[bin]]
name = "coyote-apple"
path = "src/main.rs"

[dependencies]
coyote = { path = "../coyote" }
mil_infer = { git = "https://github.com/savageAZfck/mil_spec" }
metal = "0.33.0"
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2.7.1"
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
tokenizers = "0.22"

# Local iteration on the ANE emitter — points mil_infer at the working
# tree while skeleton tiles are being added. Revert to the git rev once
# mil_spec lands the new tiles upstream.
[patch."https://github.com/savageAZfck/mil_spec"]
mil_infer = { path = "/Users/savag3/mil_spec/crates/mil_infer" }
